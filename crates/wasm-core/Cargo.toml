[package]
name = "deckcraft-wasm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DeckCraft engine as a plain C-ABI WebAssembly module (no wasm-bindgen): PPTX/.deckcraft import & export, slide rasterization and PDF, driven by JSON. Backend of the AI Slide app."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deckcraft-model = { workspace = true }
deckcraft-pptx = { workspace = true }
deckcraft-format = { workspace = true }
deckcraft-render = { workspace = true }
deckcraft-pdf = { workspace = true }
deckcraft-fonts = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
